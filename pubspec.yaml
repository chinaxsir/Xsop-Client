# 文件位置: pubspec.yaml

name: xsop_forum
description: XSOP Forum - Flarum client built with Flutter.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  shared_preferences: ^2.2.0
  flutter_widget_from_html: ^0.15.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  # [核心新增：引入 FontAwesome 图标库，与 Flarum 网页端 100% 同步]
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon.png"
  ios: true             
  android: true         
  remove_alpha_ios: true
