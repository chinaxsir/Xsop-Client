# 文件位置: .github/workflows/build_all.yml

name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: '请输入本次版本的更新说明 (将自动展示在 Release 页面中)'
        required: false
        default: '修复 Android 打包 KTS 文件后缀导致的报错中断'

env:
  APP_NAME: XSOPForum

jobs:
  # ==========================================
  # 任务 1：构建 Android APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: '3.29.0'
          cache: true

      - name: Backup source code
        run: |
          mkdir -p assets
          tar cf src_backup.tar lib/ pubspec.yaml assets/

      - name: Generate platforms and icons
        run: |
          rm -rf ios/ android/
          flutter create . --platforms=android,ios --org com.xsop --project-name xsop_forum 2>&1
          rm -rf lib/ pubspec.yaml assets/
          tar xf src_backup.tar
          
          # 注入网络权限
          awk '/<manifest/{print;print "    <uses-permission android:name=\"android.permission.INTERNET\"/>";next}1' android/app/src/main/AndroidManifest.xml > tmp.xml && mv tmp.xml android/app/src/main/AndroidManifest.xml

          # [终极修复：使用 if 判断精准命中文件，彻底避免文件不存在造成的打包中断]
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "检测到新版 KTS 文件，正在注入 API 36 兼容..."
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            echo "检测到旧版 Gradle 文件，正在注入 API 36 兼容..."
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
          fi
          
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --dart-define=BASE_URL=https://xsop.de

      - name: Rename APK
        run: |
          OUTPUT_DIR="${GITHUB_WORKSPACE}/build/apk_output"
          mkdir -p "$OUTPUT_DIR"
          
          TAG_SUFFIX="v1.0.${{ github.run_number }}"
          FINAL_APK_NAME="XPClent ${TAG_SUFFIX}.apk"
          
          cp "build/app/outputs/flutter-apk/app-release.apk" "$OUTPUT_DIR/$FINAL_APK_NAME"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: XSOP v1.0.${{ github.run_number }}
          body: "🚀 全端版本 v1.0.${{ github.run_number }} 已构建完成。\n\n📝 **更新说明**：\n${{ github.event.inputs.release_notes }}"
          files: build/apk_output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # 任务 2：构建 iOS 巨魔 IPA
  # ==========================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: '3.29.0'
          cache: true

      - name: Backup source code
        run: |
          mkdir -p assets
          tar cf src_backup.tar lib/ pubspec.yaml assets/

      - name: Generate iOS and icons
        run: |
          rm -rf ios/ android/
          flutter create . --platforms=ios,android --org com.xsop --project-name xsop_forum 2>&1
          rm -rf lib/ pubspec.yaml assets/
          tar xf src_backup.tar
          flutter pub get
          dart run flutter_launcher_icons

      - name: Configure Info.plist securely
        run: |
          # 使用 plutil 安全注入应用名称和相册权限，完美保留多任务后台图标
          PLIST="ios/Runner/Info.plist"
          plutil -replace CFBundleIdentifier -string "com.xsop.forum" "$PLIST"
          plutil -replace CFBundleDisplayName -string "XSOP" "$PLIST"
          plutil -replace CFBundleName -string "XSOP" "$PLIST"
          plutil -insert NSPhotoLibraryUsageDescription -string "我们需要访问您的相册，以便您在发帖或回复时能够上传图片。" "$PLIST"

      - name: Configure Xcode project (No Sign)
        run: |
          XCCONFIG="ios/Flutter/Release.xcconfig"
          echo "DEVELOPMENT_TEAM = ABCDE12345" >> "$XCCONFIG"
          echo "CODE_SIGNING_ALLOWED = NO" >> "$XCCONFIG"
          echo "CODE_SIGNING_REQUIRED = NO" >> "$XCCONFIG"
          echo "CODE_SIGN_IDENTITY = -" >> "$XCCONFIG"

      - name: Build .app
        run: |
          cd ios
          flutter build ios --no-codesign --dart-define=BASE_URL=https://xsop.de

      - name: Package IPA
        run: |
          OUTPUT_DIR="${GITHUB_WORKSPACE}/build/ipa_output"
          APP_PATH=$(find build ios/build -name "*.app" -not -path "*/.symlinks/*" -type d 2>/dev/null | head -1)
          
          cat > ios/Runner/Runner.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.ubiquity-kvstore-access</key>
              <true/>
              <key>com.apple.developer.kernel.extended-virtual-address-space</key>
              <true/>
              <key>com.apple.security.allow-unsigned-executable-memory</key>
              <true/>
          </dict>
          </plist>
          PLIST

          brew install ldid
          APP_NAME=$(basename "$APP_PATH" .app)
          ldid -Sios/Runner/Runner.entitlements "$APP_PATH/"
          
          TAG_SUFFIX="v1.0.${{ github.run_number }}"
          FINAL_IPA_NAME="XPClent ${TAG_SUFFIX}.ipa"

          mkdir -p "$OUTPUT_DIR"
          STAGING="${GITHUB_WORKSPACE}/build/staging"
          mkdir -p "$STAGING/Payload"
          cp -r "$APP_PATH" "$STAGING/Payload/"

          cd "$STAGING"
          zip -r "$FINAL_IPA_NAME" Payload/ -x "*.DS_Store"
          cp "$FINAL_IPA_NAME" "$OUTPUT_DIR/"

      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: XSOP v1.0.${{ github.run_number }}
          body: "🚀 全端版本 v1.0.${{ github.run_number }} 已构建完成。\n\n📝 **更新说明**：\n${{ github.event.inputs.release_notes }}"
          files: build/ipa_output/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
