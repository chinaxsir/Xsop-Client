# 文件位置: .github/workflows/build_all.yml

name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: '请输入本次版本的更新说明 (将自动展示在 Release 页面中)'
        required: false
        default: '新增通知中心与发帖图片上传功能'

env:
  APP_NAME: XSOPForum

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: '3.29.0'
          cache: true

      - name: Backup source code
        run: |
          mkdir -p assets
          tar cf src_backup.tar lib/ pubspec.yaml assets/

      - name: Generate platforms and icons
        run: |
          rm -rf ios/ android/
          flutter create . --platforms=android,ios --project-name=xsop_forum 2>&1
          rm -rf lib/ pubspec.yaml assets/
          tar xf src_backup.tar
          
          awk '/<manifest/{print;print "    <uses-permission android:name=\"android.permission.INTERNET\"/>";next}1' android/app/src/main/AndroidManifest.xml > tmp.xml && mv tmp.xml android/app/src/main/AndroidManifest.xml
          
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --dart-define=BASE_URL=https://xsop.de

      - name: Rename APK
        run: |
          OUTPUT_DIR="${GITHUB_WORKSPACE}/build/apk_output"
          mkdir -p "$OUTPUT_DIR"
          
          TAG_SUFFIX="v1.0.${{ github.run_number }}"
          FINAL_APK_NAME="XPClent ${TAG_SUFFIX}.apk"
          
          cp "build/app/outputs/flutter-apk/app-release.apk" "$OUTPUT_DIR/$FINAL_APK_NAME"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: XSOP v1.0.${{ github.run_number }}
          body: "🚀 全端版本 v1.0.${{ github.run_number }} 已构建完成。\n\n📝 **更新说明**：\n${{ github.event.inputs.release_notes }}"
          files: build/apk_output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: '3.29.0'
          cache: true

      - name: Backup source code
        run: |
          mkdir -p assets
          tar cf src_backup.tar lib/ pubspec.yaml assets/

      - name: Generate iOS and icons
        run: |
          rm -rf ios/ android/
          flutter create . --platforms=ios,android --project-name=xsop_forum 2>&1
          rm -rf lib/ pubspec.yaml assets/
          tar xf src_backup.tar
          flutter pub get
          dart run flutter_launcher_icons

      - name: Write Info.plist
        run: |
          cat > ios/Runner/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleDisplayName</key>
              <string>XSOP</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>com.xsop.forum</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$(FLUTTER_BUILD_NAME)</string>
              <key>CFBundleVersion</key>
              <string>$(FLUTTER_BUILD_NUMBER)</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon</string>
                      </array>
                  </dict>
              </dict>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              
              <!-- [修改备注：关键安全配置！注入相册访问权限声明，防止选图闪退] -->
              <key>NSPhotoLibraryUsageDescription</key>
              <string>我们需要访问您的相册，以便您在发帖或回复时能够上传图片。</string>
              
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIMainStoryboardFile</key>
              <string>Main</string>
              <key>CADisableMinimumFrameDurationOnPhone</key>
              <true/>
              <key>UIApplicationSupportsIndirectInputEvents</key>
              <true/>
              <key>IPHONEOS_DEPLOYMENT_TARGET</key>
              <string>15.0</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST

      - name: Configure Xcode project (No Sign)
        run: |
          XCCONFIG="ios/Flutter/Release.xcconfig"
          echo "DEVELOPMENT_TEAM = ABCDE12345" >> "$XCCONFIG"
          echo "CODE_SIGNING_ALLOWED = NO" >> "$XCCONFIG"
          echo "CODE_SIGNING_REQUIRED = NO" >> "$XCCONFIG"
          echo "CODE_SIGN_IDENTITY = -" >> "$XCCONFIG"

      - name: Build .app
        run: |
          cd ios
          flutter build ios --no-codesign --dart-define=BASE_URL=https://xsop.de

      - name: Package IPA
        run: |
          OUTPUT_DIR="${GITHUB_WORKSPACE}/build/ipa_output"
          APP_PATH=$(find build ios/build -name "*.app" -not -path "*/.symlinks/*" -type d 2>/dev/null | head -1)
          
          cat > ios/Runner/Runner.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.ubiquity-kvstore-access</key>
              <true/>
              <key>com.apple.developer.kernel.extended-virtual-address-space</key>
              <true/>
              <key>com.apple.security.allow-unsigned-executable-memory</key>
              <true/>
          </dict>
          </plist>
          PLIST

          brew install ldid
          APP_NAME=$(basename "$APP_PATH" .app)
          ldid -Sios/Runner/Runner.entitlements "$APP_PATH/"
          
          TAG_SUFFIX="v1.0.${{ github.run_number }}"
          FINAL_IPA_NAME="XPClent ${TAG_SUFFIX}.ipa"

          mkdir -p "$OUTPUT_DIR"
          STAGING="${GITHUB_WORKSPACE}/build/staging"
          mkdir -p "$STAGING/Payload"
          cp -r "$APP_PATH" "$STAGING/Payload/"

          cd "$STAGING"
          zip -r "$FINAL_IPA_NAME" Payload/ -x "*.DS_Store"
          cp "$FINAL_IPA_NAME" "$OUTPUT_DIR/"

      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: XSOP v1.0.${{ github.run_number }}
          body: "🚀 全端版本 v1.0.${{ github.run_number }} 已构建完成。\n\n📝 **更新说明**：\n${{ github.event.inputs.release_notes }}"
          files: build/ipa_output/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
